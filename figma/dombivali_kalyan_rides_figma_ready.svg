<svg xmlns="http://www.w3.org/2000/svg" width="2760" height="1004" viewBox="0 0 2760 1004">
<style>
  .label{font:700 18px Inter,Arial,sans-serif; fill:#D4AF37}
  .txt{font:500 14px Inter,Arial,sans-serif; fill:#F2E3BF}
  .muted{font:500 12px Inter,Arial,sans-serif; fill:#C7AB6F}
  .btn{fill:#D4AF37; stroke:none}
  .field{fill:#4A3325}
  .card{fill:#3A271C; stroke:#7A5A2B; stroke-width:1}
</style>
<rect x="0" y="0" width="2760" height="1004" fill="#120B08"/>
<text x="60" y="56" class="label">Dombivali-Kalyan Rides • Figma-ready UI Frames</text>

<g transform="translate(60,90)">
  <rect x="0" y="0" width="390" height="844" rx="36" fill="#1B120D" stroke="#D4AF37" stroke-width="3"/>
  <rect x="18" y="20" width="354" height="36" rx="12" fill="#2E1F17"/>
  <text x="195.0" y="43" text-anchor="middle" fill="#D4AF37" font-size="16" font-weight="700">Registration</text>
  
<text x="30" y="120" class="label" style="font-size:24px">Welcome</text>
<rect class="field" x="30" y="150" width="330" height="54" rx="12"/><text x="46" y="183" class="txt">Full Name</text>
<rect class="field" x="30" y="218" width="330" height="54" rx="12"/><text x="46" y="251" class="txt">Mobile Number</text>
<rect class="btn" x="30" y="748" width="330" height="56" rx="14"/><text x="195" y="782" text-anchor="middle" style="font:700 18px Inter,Arial;fill:#1B120D">Continue</text>

</g>
<g transform="translate(510,90)">
  <rect x="0" y="0" width="390" height="844" rx="36" fill="#1B120D" stroke="#D4AF37" stroke-width="3"/>
  <rect x="18" y="20" width="354" height="36" rx="12" fill="#2E1F17"/>
  <text x="195.0" y="43" text-anchor="middle" fill="#D4AF37" font-size="16" font-weight="700">Profile Setup</text>
  
<rect class="card" x="30" y="120" width="330" height="240" rx="16"/>
<text x="46" y="156" class="txt">Name: Rahul Patil</text>
<rect class="field" x="46" y="176" width="298" height="50" rx="12"/><text x="60" y="206" class="txt">Email</text>
<rect class="field" x="46" y="238" width="298" height="50" rx="12"/><text x="60" y="268" class="txt">Role: Commuter ▾</text>
<rect class="btn" x="30" y="748" width="330" height="56" rx="14"/><text x="195" y="782" text-anchor="middle" style="font:700 17px Inter,Arial;fill:#1B120D">Proceed to Ride Booking</text>

</g>
<g transform="translate(960,90)">
  <rect x="0" y="0" width="390" height="844" rx="36" fill="#1B120D" stroke="#D4AF37" stroke-width="3"/>
  <rect x="18" y="20" width="354" height="36" rx="12" fill="#2E1F17"/>
  <text x="195.0" y="43" text-anchor="middle" fill="#D4AF37" font-size="16" font-weight="700">Ride Booking</text>
  
<rect class="field" x="30" y="120" width="330" height="54" rx="12"/><text x="46" y="153" class="txt">Pickup: Dombivali Station</text>
<rect class="field" x="30" y="186" width="330" height="54" rx="12"/><text x="46" y="219" class="txt">Drop: Kalyan Station</text>
<rect class="card" x="30" y="260" width="330" height="110" rx="16"/>
<text x="46" y="294" class="txt">Map preview / route panel</text>
<text x="46" y="320" class="muted">Distance: 11.2 km • ETA: 28 min</text>
<rect class="btn" x="30" y="748" width="330" height="56" rx="14"/><text x="195" y="782" text-anchor="middle" style="font:700 18px Inter,Arial;fill:#1B120D">Choose Vehicle</text>

</g>
<g transform="translate(1410,90)">
  <rect x="0" y="0" width="390" height="844" rx="36" fill="#1B120D" stroke="#D4AF37" stroke-width="3"/>
  <rect x="18" y="20" width="354" height="36" rx="12" fill="#2E1F17"/>
  <text x="195.0" y="43" text-anchor="middle" fill="#D4AF37" font-size="16" font-weight="700">Vehicle & Pricing</text>
  
<rect class="card" x="30" y="120" width="330" height="90" rx="16" stroke="#D4AF37" stroke-width="2"/>
<text x="46" y="154" class="txt">Auto</text><text x="300" y="154" class="txt">₹130</text>
<text x="46" y="178" class="muted">Fastest for city commute</text>
<rect class="card" x="30" y="224" width="330" height="90" rx="16"/>
<text x="46" y="258" class="txt">Mini</text><text x="300" y="258" class="txt">₹190</text>
<rect class="card" x="30" y="328" width="330" height="90" rx="16"/>
<text x="46" y="362" class="txt">Sedan</text><text x="300" y="362" class="txt">₹260</text>
<rect class="btn" x="30" y="748" width="330" height="56" rx="14"/><text x="195" y="782" text-anchor="middle" style="font:700 18px Inter,Arial;fill:#1B120D">Confirm Ride</text>

</g>
<g transform="translate(1860,90)">
  <rect x="0" y="0" width="390" height="844" rx="36" fill="#1B120D" stroke="#D4AF37" stroke-width="3"/>
  <rect x="18" y="20" width="354" height="36" rx="12" fill="#2E1F17"/>
  <text x="195.0" y="43" text-anchor="middle" fill="#D4AF37" font-size="16" font-weight="700">Matching</text>
  
<circle cx="195" cy="230" r="44" fill="#3A271C" stroke="#D4AF37" stroke-width="3"/>
<text x="195" y="238" text-anchor="middle" style="font:700 28px Inter,Arial;fill:#D4AF37">🚕</text>
<text x="195" y="310" text-anchor="middle" class="txt">Matching nearby driver...</text>
<rect class="card" x="30" y="360" width="330" height="170" rx="16"/>
<text x="46" y="396" class="txt">Driver: Mahesh S.</text>
<text x="46" y="424" class="txt">Vehicle: Auto • MH 05 AB 2143</text>
<text x="46" y="452" class="muted">Arriving in 4 min</text>
<rect class="btn" x="30" y="748" width="330" height="56" rx="14"/><text x="195" y="782" text-anchor="middle" style="font:700 18px Inter,Arial;fill:#1B120D">Complete Ride</text>

</g>
<g transform="translate(2310,90)">
  <rect x="0" y="0" width="390" height="844" rx="36" fill="#1B120D" stroke="#D4AF37" stroke-width="3"/>
  <rect x="18" y="20" width="354" height="36" rx="12" fill="#2E1F17"/>
  <text x="195.0" y="43" text-anchor="middle" fill="#D4AF37" font-size="16" font-weight="700">Completion & Rating</text>
  
<rect class="card" x="30" y="160" width="330" height="170" rx="16"/>
<text x="195" y="214" text-anchor="middle" class="txt">Pay Cash to Driver</text>
<text x="195" y="262" text-anchor="middle" style="font:700 46px Inter,Arial;fill:#D4AF37">₹130</text>
<rect class="btn" x="30" y="360" width="330" height="56" rx="14"/><text x="195" y="395" text-anchor="middle" style="font:700 18px Inter,Arial;fill:#1B120D">Paid - Rate Driver</text>
<rect class="card" x="30" y="440" width="330" height="140" rx="16"/>
<text x="195" y="480" text-anchor="middle" class="txt">Rate Your Ride</text>
<text x="195" y="528" text-anchor="middle" style="font:700 32px Inter,Arial;fill:#D4AF37">★ ★ ★ ★ ★</text>

</g>
</svg>